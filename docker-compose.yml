services:
  postgres:
    image: postgres:16
    container_name: careerflow-postgres
    restart: always
    environment:
      POSTGRES_USER: careerflow
      POSTGRES_PASSWORD: careerflow_dev_password
      POSTGRES_DB: careerflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: